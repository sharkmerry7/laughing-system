<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cafe Calorie Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Cafe Calorie Analyzer</h1>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('analyze') }}">Analysis</a></li>
                <li><a href="{{ url_for('upload') }}">Upload Data</a></li>
                <li><a href="{{ url_for('scrape') }}">Scrape Menu</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>Cafe Calorie Per Dollar Analyzer | Find the best value items on your menu</p>
        </div>
    </footer>
</body>
</html>
